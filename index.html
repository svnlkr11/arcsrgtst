<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kavak Belediyesi Araç Sorgu Sistemi</title>

<!-- Favicon Eklentisi -->
<link rel="icon" type="image/png" href="res/kavak-logo.png">
<link rel="apple-touch-icon" href="res/kavak-logo.png">

<style>
  :root{
    --navy:#16324a;
    --navy-deep:#0e2233;
    --amber:#e8a33d;
    --amber-deep:#c8842a;
    --cream:#f6f4ef;
    --card:#ffffff;
    --ink:#22282e;
    --ink-soft:#5a6570;
    --line:#e4e0d6;
    --danger:#b3432f;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    padding-bottom: 20px; 
  }

  header{
    background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
    color:#fff;
    padding:22px 18px 18px;
    position:sticky;
    top:0;
    z-index:20;
    box-shadow:0 4px 14px rgba(14,34,51,0.25);
  }
  .header-top{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:14px;
  }
  .header-top img{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    flex:0 0 auto;
    background:#fff;
    border:2px solid #fff;
    box-shadow:0 2px 6px rgba(0,0,0,0.25);
  }
  .header-text{min-width:0;flex:1 1 auto;}
  .header-actions{
    margin-left:auto;
    display:flex;
    gap:6px;
    flex:0 0 auto;
  }
  .icon-btn{
    width:38px;
    height:38px;
    border-radius:50%;
    background:rgba(255,255,255,0.14);
    border:none;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
  }
  .icon-btn:active{background:rgba(255,255,255,0.28);}
  .icon-btn svg{width:18px;height:18px;stroke:#fff;}
  .subtitle{
    font-size:12.5px;
    color:rgba(255,255,255,0.72);
    font-weight:500;
    margin-top:2px;
  }
  .developer-note {
    font-size:11px;
    color:rgba(255,255,255,0.55);
    margin-top:4px;
    font-style:italic;
  }
  h1{
    margin:0;
    font-size:23px;
    font-weight:800;
    letter-spacing:-0.01em;
  }
  .search-wrap{
    position:relative;
  }
  .search-wrap input{
    width:100%;
    padding:13px 14px 13px 40px;
    border-radius:12px;
    border:none;
    font-size:16px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  .search-wrap input:focus{
    box-shadow:0 0 0 3px rgba(232,163,61,0.5);
  }
  .search-wrap svg{
    position:absolute;
    left:13px;
    top:50%;
    transform:translateY(-50%);
    width:18px;
    height:18px;
    stroke:var(--ink-soft);
  }
  .count-pill{
    display:inline-block;
    margin-top:10px;
    font-size:12px;
    color:rgba(255,255,255,0.72);
  }

  main{
    padding:14px 14px 4px;
    max-width:640px;
    margin:0 auto;
    min-height: 50vh; 
  }

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
  }
  .empty svg{width:40px;height:40px;stroke:var(--ink-soft);opacity:.5;margin-bottom:10px;}
  .empty p{margin:4px 0;font-size:14px;}
  .empty .hint{font-size:12.5px;opacity:.75;}

  .record{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:14px 14px 12px;
    margin-bottom:10px;
    display:flex;
    gap:12px;
    align-items:flex-start;
  }
  .plate{
    flex:0 0 auto;
    display:flex;
    border-radius:6px;
    overflow:hidden;
    border:1.5px solid #1c2a33;
    font-family:"Arial Narrow",Arial,sans-serif;
    font-weight:700;
    min-width:78px;
    margin-top: 2px;
  }
  .plate .flag{
    background:var(--navy);
    color:#fff;
    font-size:8px;
    width:14px;
    display:flex;
    align-items:center;
    justify-content:center;
    letter-spacing:0;
  }
  .plate .num{
    background:#fff;
    color:#111;
    font-size:14px;
    padding:6px 9px;
    letter-spacing:1px;
    white-space:nowrap;
  }
  .info{flex:1 1 auto;min-width:0;}
  
  .badge {
    display: inline-block;
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 5px;
    letter-spacing: 0.5px;
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s ease, filter 0.15s ease;
  }
  .badge:active { transform: scale(0.92); filter: brightness(0.9); }
  .badge.gri { background: var(--line); color: var(--ink-soft); } 
  .badge.yesil { background: #e6f4ea; color: #1e8e3e; }
  .badge.sari { background: #fef7e0; color: #f9ab00; }
  .badge.kirmizi { background: #fce8e6; color: #d93025; }

  .info .name{
    font-size:15.5px;
    font-weight:600;
    margin:0 0 4px;
    color:var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .alarm-icon {
    font-size: 14px;
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.1); opacity: 0.7; }
    100% { transform: scale(1); opacity: 1; }
  }

  .info a.phone{
    font-size:13.5px;
    color:var(--navy);
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:5px;
    font-weight:600;
  }
  .info a.phone svg{width:13px;height:13px;stroke:var(--navy);}
  
  .note-text {
    font-size: 12px;
    color: var(--ink-soft);
    margin: 6px 0 0 0;
    font-style: italic;
    line-height: 1.4;
  }
  .timestamp {
    font-size: 10px;
    color: #9aa0a6;
    margin-top: 6px;
  }

  .msg-btns {
    display: flex;
    align-items: center;
    flex-wrap: wrap; /* Çakışmayı önlemek için eklendi: sığmazsa alt satıra geçer */
    gap: 8px;
    margin-top: 6px;
  }
  .wa-btn, .sms-btn, .alarm-btn {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: transform 0.2s, background 0.2s;
    flex: 0 0 auto;
    cursor: pointer;
  }
  .wa-btn { background: #25D366; color: #fff; }
  .wa-btn:active { transform: scale(0.92); background: #1da851; }
  .wa-btn svg { width: 15px; height: 15px; }
  
  .sms-btn { background: #007AFF; color: #fff; }
  .sms-btn:active { transform: scale(0.92); background: #005bb5; }
  .sms-btn svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .alarm-btn { background: #9c27b0; color: #fff; }
  .alarm-btn:active { transform: scale(0.92); background: #7b1fa2; }
  .alarm-btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .actions{
    display:flex;
    flex-direction:column;
    gap:6px;
    flex:0 0 auto;
  }
  .actions button{
    border:none;
    background:transparent;
    padding:6px;
    cursor:pointer;
    color:var(--ink-soft);
    border-radius:8px;
  }
  .actions button:active{background:var(--line);}
  .actions svg{width:17px;height:17px;stroke:currentColor;display:block;}
  .actions .del svg{stroke:var(--danger);}

  .fab{
    position:fixed;
    right:18px;
    bottom:22px;
    width:58px;
    height:58px;
    border-radius:50%;
    background:var(--amber);
    color:var(--navy-deep);
    border:none;
    box-shadow:0 6px 18px rgba(200,132,42,0.45);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    z-index:30;
  }
  .fab svg{width:26px;height:26px;stroke:var(--navy-deep);stroke-width:2.4;}
  .fab:active{transform:scale(0.94);}

  .sheet-backdrop{
    position:fixed;inset:0;
    background:rgba(14,26,36,0.45);
    z-index:40;
    display:none;
  }
  .sheet-backdrop.open{display:block;}
  .sheet{
    position:fixed;
    left:0;right:0;bottom:0;
    background:var(--cream);
    border-radius:20px 20px 0 0;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom));
    z-index:41;
    transform:translateY(100%);
    transition:transform .25s ease;
    max-width:640px;
    margin:0 auto;
  }
  .sheet.open{transform:translateY(0);}
  .sheet h2{
    margin:2px 0 16px;
    font-size:16px;
    color:var(--navy-deep);
  }
  .field{margin-bottom:12px;}
  .field label{
    display:block;
    font-size:12px;
    font-weight:700;
    color:var(--ink-soft);
    text-transform:uppercase;
    letter-spacing:.06em;
    margin-bottom:5px;
  }
  .field input, .field select{
    width:100%;
    padding:12px 13px;
    border-radius:10px;
    border:1.5px solid var(--line);
    font-size:16px;
    background:#fff;
    outline:none;
    color:var(--ink);
  }
  .field input:focus, .field select:focus{border-color:var(--navy);}
  .sheet-actions{
    display:flex;
    gap:10px;
    margin-top:6px;
  }
  .btn{
    flex:1;
    padding:13px;
    border-radius:12px;
    border:none;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .btn.primary{background:var(--navy);color:#fff;}
  .btn.ghost{background:transparent;color:var(--ink-soft);border:1.5px solid var(--line);}

  .toast{
    position:fixed;
    left:50%;
    bottom:96px;
    transform:translateX(-50%) translateY(10px);
    background:var(--navy-deep);
    color:#fff;
    padding:10px 16px;
    border-radius:10px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:all .25s ease;
    z-index:50;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding-bottom: 16px;
  }
  .page-btn {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    background: #fff;
    color: var(--ink);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .page-btn:active { background: var(--line); }
  .page-btn:disabled { opacity: 0.5; cursor: not-allowed; background: transparent; }
  .page-info { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; }

  .footer {
    text-align: center;
    padding: 24px 16px 90px;
    color: var(--ink-soft);
    font-size: 13px;
    max-width: 640px;
    margin: 0 auto;
  }
  .footer p { margin: 6px 0; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <!-- Logoya tıklayınca yeniler -->
    <img src="res/kavak-logo.png" alt="Kavak Belediyesi logosu" onclick="window.location.reload();" style="cursor: pointer;" title="Anasayfaya Dön">
    <!-- Başlığa tıklayınca yeniler -->
    <div class="header-text" onclick="window.location.reload();" style="cursor: pointer;" title="Anasayfaya Dön">
      <h1>Kavak Belediyesi</h1>
      <div class="subtitle">Araç Sorgu Sistemi</div>
      <div class="developer-note">Bekir Sevnc tarafından oluşturulmuştur</div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="downloadBtn" aria-label="İndir">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="shareBtn" aria-label="Paylaş">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>
      </button>
      <button class="icon-btn" id="restoreBtn" aria-label="Geri Yükle">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 2.64-6.36"/><polyline points="3 3 3 8 8 8"/></svg>
      </button>
      <input type="file" id="restoreInput" accept=".csv,text/csv" style="display:none">
    </div>
  </div>
  <div class="search-wrap">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input id="search" type="text" placeholder="Plaka, ad soyad veya telefon ara..." autocomplete="off">
  </div>
  <div class="count-pill" id="countPill">Yükleniyor...</div>
</header>

<main id="list"></main>

<div class="footer">
    <p>Kavak Belediyesi © 2026 - Tüm hakları saklıdır</p>       
    <p>Bu proje Bekir Sevnc tarafından Kavak Belediyesi için oluşturulmuştur</p>
</div>

<button class="fab" id="openAdd" aria-label="Yeni kayıt ekle">
  <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet">
  <h2 id="sheetTitle">Yeni Kayıt</h2>
  <div class="field">
    <label>Plaka</label>
    <input id="fPlaka" type="text" placeholder="50 AB 123" autocapitalize="characters">
  </div>
  <div class="field">
    <label>Ad Soyad</label>
    <input id="fAd" type="text" placeholder="Ad Soyad">
  </div>
  <div class="field">
    <label>Telefon</label>
    <input id="fTel" type="tel" placeholder="05xx xxx xx xx">
  </div>
  <div class="field">
    <label>Uyarı Durumu</label>
    <select id="fEtiket">
      <option value="">Seçilmedi (Gri)</option>
      <option value="yesil">Az Uyarılan (Yeşil)</option>
      <option value="sari">Sık Uyarılan (Sarı)</option>
      <option value="kirmizi">Sürekli Hatalı Park (Kırmızı)</option>
    </select>
  </div>
  <div class="field">
    <label>Açıklama / Not</label>
    <input id="fNot" type="text" placeholder="Örn: Sürekli sokağa park ediyor">
  </div>
  <div class="sheet-actions">
    <button class="btn ghost" id="cancelBtn">Vazgeç</button>
    <button class="btn primary" id="saveBtn">Kaydet</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const DB_NAME = 'zabitaAracDB';
const DB_VERSION = 1;
const STORE_NAME = 'kayitlar';
let db = null;
let records = [];
let editingId = null;

let activeAlarms = {}; 

let currentPage = 1;
const ITEMS_PER_PAGE = 10; 

const listEl = document.getElementById('list');
const countPill = document.getElementById('countPill');
const searchEl = document.getElementById('search');
const sheet = document.getElementById('sheet');
const backdrop = document.getElementById('backdrop');
const toastEl = document.getElementById('toast');

function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function splitPlate(p){
  p = (p||'').trim();
  const m = p.match(/^(\d{1,2})/);
  return { il: m ? m[1] : '', rest: p };
}

function formatPlateDisplay(p){
  p = (p||'').trim().toUpperCase();
  if(!p) return '—';
  const cleaned = p.replace(/[\s-]+/g, '');
  const m = cleaned.match(/^(\d{1,2})([A-ZÇĞİÖŞÜ]{1,3})(\d{2,4})$/);
  if(m) return `${m[1]} ${m[2]} ${m[3]}`;
  return p; 
}

function formatDate(ts) {
  if(!ts) return '';
  const d = new Date(ts);
  return d.toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
}

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const database = e.target.result;
      if(!database.objectStoreNames.contains(STORE_NAME)){
        database.createObjectStore(STORE_NAME, { keyPath: 'id' });
      }
    };
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}

function dbGetAll(){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = ()=> reject(req.error);
  });
}

function dbPut(record){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(record);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

function dbDelete(id){
  return new Promise((resolve, reject)=>{
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = ()=> resolve();
    tx.onerror = ()=> reject(tx.error);
  });
}

async function loadRecords(){
  try{
    if(!db) db = await openDB();
    records = await dbGetAll();
  }catch(e){
    records = [];
    showToast('Depolama açılamadı');
  }
  render();
}

function render(){
  const q = searchEl.value.trim().toLocaleLowerCase('tr-TR');
  let filtered = !q ? records : records.filter(r=>{
    return (r.plaka||'').toLocaleLowerCase('tr-TR').includes(q)
        || (r.ad||'').toLocaleLowerCase('tr-TR').includes(q)
        || (r.tel||'').replace(/\s/g,'').includes(q.replace(/\s/g,''))
        || (r.not||'').toLocaleLowerCase('tr-TR').includes(q);
  });

  countPill.textContent = records.length === 0
    ? 'Henüz kayıt yok'
    : `${filtered.length} / ${records.length} kayıt`;

  if(filtered.length === 0){
    listEl.innerHTML = `
      <div class="empty">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <p>${records.length === 0 ? 'Kayıt bulunamadı' : 'Sonuç bulunamadı'}</p>
        <p class="hint">${records.length === 0 ? 'Sağ alttaki + ile ilk kaydı ekleyin' : 'Farklı bir arama deneyin'}</p>
      </div>`;
    return;
  }

  filtered.sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0));

  const totalPages = Math.ceil(filtered.length / ITEMS_PER_PAGE);
  if (currentPage > totalPages) currentPage = totalPages || 1; 
  const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
  const paginatedRecords = filtered.slice(startIndex, startIndex + ITEMS_PER_PAGE);

  let html = paginatedRecords.map(r => {
    let tagHtml = '';
    if(r.etiket === 'yesil') tagHtml = `<span class="badge status-badge yesil" data-id="${r.id}" title="Durumu değiştirmek için dokun">Az Uyarılan</span>`;
    else if(r.etiket === 'sari') tagHtml = `<span class="badge status-badge sari" data-id="${r.id}" title="Durumu değiştirmek için dokun">Sık Uyarılan</span>`;
    else if(r.etiket === 'kirmizi') tagHtml = `<span class="badge status-badge kirmizi" data-id="${r.id}" title="Durumu değiştirmek için dokun">Sürekli Hatalı</span>`;
    else tagHtml = `<span class="badge status-badge gri" data-id="${r.id}" title="Durum eklemek için dokun">Durum Belirtilmedi</span>`;

    const messageTemplate = encodeURIComponent(`Sayın ${(r.ad || 'İsimsiz').split(' ').map(w => w.charAt(0).toLocaleUpperCase('tr-TR') + w.slice(1).toLocaleLowerCase('tr-TR')).join(' ')} ${(r.plaka || '').replace(/\s+/g, '').toLocaleUpperCase('tr-TR')} plakalı aracınızı bulunduğu yerden kaldırmanız gerekmektedir.\n\nKavak Belediyesi\nZabıta`);
    const pureTel = (r.tel || '').replace(/\D/g, '').slice(-10);

    const hasAlarm = activeAlarms[r.id] !== undefined;

    return `
    <div class="record" data-id="${r.id}">
      <div class="plate">
        <div class="flag">TR</div>
        <div class="num">${escapeHtml(formatPlateDisplay(r.plaka))}</div>
      </div>
      <div class="info">
        ${tagHtml}
        <div class="name">

  if (totalPages > 1) {
    html += `
      <div class="pagination">

window.changePage = function(direction) {
  currentPage += direction;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
};

function openSheet(record){
  editingId = record ? record.id : null;
  document.getElementById('sheetTitle').textContent = record ? 'Kaydı Düzenle' : 'Yeni Kayıt';
  document.getElementById('fPlaka').value = record ? record.plaka : '';
  document.getElementById('fAd').value = record ? record.ad : '';
  document.getElementById('fTel').value = record ? record.tel : '';
  document.getElementById('fEtiket').value = record && record.etiket ? record.etiket : '';
  document.getElementById('fNot').value = record && record.not ? record.not : '';
  
  backdrop.classList.add('open');
  sheet.classList.add('open');
  setTimeout(()=>document.getElementById('fPlaka').focus(), 200);
}

function closeSheet(){
  backdrop.classList.remove('open');
  sheet.classList.remove('open');
  editingId = null;
}

document.getElementById('openAdd').addEventListener('click', ()=>openSheet(null));
document.getElementById('cancelBtn').addEventListener('click', closeSheet);
backdrop.addEventListener('click', closeSheet);

document.getElementById('saveBtn').addEventListener('click', async ()=>{
  const plaka = document.getElementById('fPlaka').value.trim().toUpperCase();
  const ad = document.getElementById('fAd').value.trim();
  const tel = document.getElementById('fTel').value.trim();
  const etiket = document.getElementById('fEtiket').value;
  const notVal = document.getElementById('fNot').value.trim();

  if(!plaka && !ad && !tel){
    showToast('Plaka, ad veya telefondan birini girin');
    return;
  }

  let record;
  if(editingId){
    const idx = records.findIndex(r=>r.id === editingId);
    record = { ...records[idx], plaka, ad, tel, etiket, not: notVal, updatedAt: Date.now() };
  }else{
    record = {
      id: 'k' + Date.now() + Math.random().toString(36).slice(2,7),
      plaka, ad, tel, etiket, not: notVal,
      updatedAt: Date.now()
    };
  }

  try{
    await dbPut(record);
    await loadRecords();
    closeSheet();
    showToast('Kayıt kaydedildi');
  }catch(e){
    showToast('Kayıt sırasında bir sorun oluştu');
  }
});

// LİSTE ÜZERİNDEKİ TIKLAMA OLAYLARI 
listEl.addEventListener('click', (e)=>{
  const editBtn = e.target.closest('.edit');
  const delBtn = e.target.closest('.del');
  const badgeBtn = e.target.closest('.status-badge');
  const alarmBtn = e.target.closest('.alarm-btn');
  
  // 1. Etiket Değiştirme
  if(badgeBtn){
    const rec = records.find(r=>r.id === badgeBtn.dataset.id);
    if(rec){
      let nextState = '';
      let stateName = '';
      
      if(!rec.etiket) { nextState = 'yesil'; stateName = 'Az Uyarılan (Yeşil)'; }
      else if(rec.etiket === 'yesil') { nextState = 'sari'; stateName = 'Sık Uyarılan (Sarı)'; }
      else if(rec.etiket === 'sari') { nextState = 'kirmizi'; stateName = 'Sürekli Hatalı (Kırmızı)'; }
      else if(rec.etiket === 'kirmizi') { nextState = ''; stateName = 'Durum Belirtilmedi (Gri)'; }
      
      if(confirm(`Bu aracın uyarı durumunu "${stateName}" olarak değiştirmek istediğinize emin misiniz?`)){
        rec.etiket = nextState;
        rec.updatedAt = Date.now();
        dbPut(rec).then(() => { loadRecords(); showToast('Uyarı durumu güncellendi'); });
      }
    }
  }

  // 2. Alarm/Hatırlatıcı Kurma
  if(alarmBtn){
    const recId = alarmBtn.dataset.id;
    if(activeAlarms[recId]) {
      if(confirm("Bu araç için kurulu bir alarm var. İptal edilsin mi?")) {
        delete activeAlarms[recId];
        render();
        showToast('Alarm iptal edildi');
      }
      return;
    }

    const mins = prompt("Araç sahibi kaç dakika süre istedi? (Sayı girin)", "10");
    if(mins && !isNaN(mins) && Number(mins) > 0){
      activeAlarms[recId] = Date.now() + (Number(mins) * 60000); 
      render();
      showToast(`${mins} dakika sonrasına alarm kuruldu`);
    } else if(mins !== null) {
      showToast('Geçerli bir sayı girmelisiniz');
    }
  }

  // 3. Düzenle & Sil
  if(editBtn){
    const rec = records.find(r=>r.id === editBtn.dataset.id);
    if(rec) openSheet(rec);
  }
  if(delBtn){
    const rec = records.find(r=>r.id === delBtn.dataset.id);
    if(rec && confirm(`"${rec.ad || rec.plaka || 'Bu kayıt'}" silinsin mi?`)){
      dbDelete(rec.id).then(loadRecords).then(()=>{
        showToast('Kayıt silindi');
      }).catch(()=>{
        showToast('Silme sırasında bir sorun oluştu');
      });
    }
  }
});

// HER 5 SANİYEDE BİR ALARMLARI KONTROL ET
setInterval(() => {
  const now = Date.now();
  let needRender = false;

  for(let id in activeAlarms){
    if(now >= activeAlarms[id]){
      const rec = records.find(r => r.id === id);
      delete activeAlarms[id];
      needRender = true;

      if(rec){
        const plate = formatPlateDisplay(rec.plaka);
        const name = rec.ad || 'İsimsiz';
        
        alert(`⏰ SÜRE DOLDU!\n\nPlaka: ${plate}\nİsim: ${name}\n\nAraç sahibinin verdiği süre doldu, lütfen kontrol ediniz.`);
      }
    }
  }

  if(needRender) render();
}, 5000);

searchEl.addEventListener('input', () => {
  currentPage = 1; 
  render();
});

function csvEscape(v){
  v = String(v == null ? '' : v);
  if(/[";\n]/.test(v)) return '"' + v.replace(/"/g,'""') + '"';
  return v;
}

function buildCSV(){
  const rows = [['Plaka','Ad Soyad','Telefon','Etiket','Not']];
  records
    .slice()
    .sort((a,b)=> (b.updatedAt||0) - (a.updatedAt||0))
    .forEach(r => rows.push([r.plaka||'', r.ad||'', r.tel||'', r.etiket||'', r.not||'']));
  const body = rows.map(row => row.map(csvEscape).join(';')).join('\r\n');
  return '\uFEFF' + body; 
}

function csvFileName(){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `arac-kayitlari-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
}

function downloadCSV(){
  if(records.length === 0){
    showToast('İndirilecek kayıt yok');
    return;
  }
  const blob = new Blob([buildCSV()], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = csvFileName();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
  showToast('Dosya indirildi');
}

async function shareCSV(){
  if(records.length === 0){
    showToast('Paylaşılacak kayıt yok');
    return;
  }
  const blob = new Blob([buildCSV()], { type: 'text/csv;charset=utf-8;' });
  const file = new File([blob], csvFileName(), { type: 'text/csv' });

  if(navigator.canShare && navigator.canShare({ files: [file] })){
    try{
      await navigator.share({
        files: [file],
        title: 'Kavak Belediyesi Plaka Kayıt',
        text: `${records.length} kayıt — Kavak Belediyesi Plaka Kayıt`
      });
    }catch(e){
    }
  }else if(navigator.share){
    try{
      await navigator.share({
        title: 'Kavak Belediyesi Plaka Kayıt',
        text: `${records.length} kayıt — dosya paylaşımı bu cihazda desteklenmiyor, lütfen indirip gönderin.`
      });
    }catch(e){}
  }else{
    showToast('Bu tarayıcı paylaşımı desteklemiyor, dosya indiriliyor');
    downloadCSV();
  }
}

document.getElementById('downloadBtn').addEventListener('click', downloadCSV);
document.getElementById('shareBtn').addEventListener('click', shareCSV);

function parseCSV(text){
  if(text.charCodeAt(0) === 0xFEFF) text = text.slice(1); 
  const lines = text.split(/\r\n|\n/).filter(l => l.length > 0);
  return lines.map(line => {
    const row = [];
    let cur = '';
    let inQuotes = false;
    for(let i = 0; i < line.length; i++){
      const c = line[i];
      if(inQuotes){
        if(c === '"'){
          if(line[i+1] === '"'){ cur += '"'; i++; }
          else inQuotes = false;
        } else cur += c;
      } else {
        if(c === '"') inQuotes = true;
        else if(c === ';'){ row.push(cur); cur = ''; }
        else cur += c;
      }
    }
    row.push(cur);
    return row;
  });
}

function dedupeKey(plaka, tel){
  return (plaka||'').trim().toLocaleLowerCase('tr-TR') + '|' + (tel||'').replace(/\s/g,'');
}

async function handleRestoreFile(e){
  const file = e.target.files[0];
  e.target.value = ''; 
  if(!file) return;

  try{
    const text = await file.text();
    const rows = parseCSV(text);
    if(rows.length <= 1){
      showToast('Dosyada kayıt bulunamadı');
      return;
    }

    const existingKeys = new Set(records.map(r => dedupeKey(r.plaka, r.tel)));
    let added = 0;

    for(let i = 1; i < rows.length; i++){ 
      const [plaka, ad, tel, etiket, notVal] = rows[i];
      if(!plaka && !ad && !tel) continue;
      const key = dedupeKey(plaka, tel);
      if(existingKeys.has(key)) continue; 
      
      existingKeys.add(key);
      await dbPut({
        id: 'k' + Date.now() + Math.random().toString(36).slice(2,7) + added,
        plaka: (plaka||'').trim(),
        ad: (ad||'').trim(),
        tel: (tel||'').trim(),
        etiket: (etiket||'').trim(),
        not: (notVal||'').trim(),
        updatedAt: Date.now()
      });
      added++;
    }

    await loadRecords();
    showToast(added > 0 ? `${added} kayıt geri yüklendi` : 'Yeni kayıt yok, hepsi zaten mevcut');
  }catch(err){
    showToast('Dosya okunamadı, formatı kontrol edin');
  }
}

document.getElementById('restoreBtn').addEventListener('click', ()=>{
  document.getElementById('restoreInput').click();
});
document.getElementById('restoreInput').addEventListener('change', handleRestoreFile);

loadRecords();
